<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Parcours 45 km – MCS Molières</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <!-- Style clair -->
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #ffffff;
            color: #222;
        }
        h1 {
            text-align: center;
            padding: 20px 0;
            font-size: 26px;
            color: #333;
        }
        #map {
            width: 100%;
            height: 500px;
            border-bottom: 2px solid #ddd;
        }
        #profil {
            width: 100%;
            display: block;
            margin: 20px auto;
            max-width: 900px;
        }
        .container {
            padding: 20px;
            max-width: 900px;
            margin: auto;
        }
    </style>
</head>

<body>

<h1>Parcours 45 km – MCS Molières</h1>

<!-- Carte -->
<div id="map"></div>

<!-- Profil altimétrique -->
<img id="profil" src="profils/parcours45.png" alt="Profil altimétrique 45 km">

<div class="container">
    <p>
        Téléchargement GPX :  
        <a href="gpx/parcours45.gpx" download>Cliquez ici</a>
    </p>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Plugin GPX -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>

<script>
    // Initialisation de la carte
    var map = L.map('map');

    // Fond de carte clair
    L.tileLayer('https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png', {
        maxZoom: 18,
        attribution: '© OpenStreetMap'
    }).addTo(map);

    // Chargement du GPX
    var gpx = new L.GPX("gpx/parcours45.gpx", {
        async: true,
        marker_options: {
            startIconUrl: "https://unpkg.com/leaflet-gpx@1.7.0/pin-icon-start.png",
            endIconUrl: "https://unpkg.com/leaflet-gpx@1.7.0/pin-icon-end.png",
            shadowUrl: "https://unpkg.com/leaflet-gpx@1.7.0/pin-shadow.png"
        }
    }).on("loaded", function(e) {
        map.fitBounds(e.target.getBounds());
    }).addTo(map);
</script>

</body>
</html>
